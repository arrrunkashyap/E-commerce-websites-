<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Simple Shop</h1>
    <h2>🛒 Cart: <span id="count">0</span></h2>
</header>

<div class="products">

    <div class="card">
        <img src="images/laptop.jpg" alt="">
        <h3>Laptop</h3>
        <p>₹50,000</p>
        <button onclick="addToCart('Laptop',50000)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/headphones.jpg" alt="">
        <h3>Headphones</h3>
        <p>₹2,000</p>
        <button onclick="addToCart('Headphones',2000)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/watch.jpg" alt="">
        <h3>Watch</h3>
        <p>₹3,000</p>
        <button onclick="addToCart('Watch',3000)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/shoes.jpg" alt="">
        <h3>Shoes</h3>
        <p>₹2,500</p>
        <button onclick="addToCart('Shoes',2500)">Add to Cart</button>
    </div>

</div>

<h2 style="text-align:center;">Shopping Cart</h2>

<ul id="cart"></ul>

<h2 style="text-align:center;">
Total: ₹<span id="total">0</span>
</h2>

<script src="script.js"></script>

</body>
</html>
